<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verwaltung – Shop</title>
    <meta name="robots" content="noindex, nofollow">
    <meta name="color-scheme" content="light">
    <meta name="theme-color" content="#f4f1fb">
    <script src="/js/modus.js?v=1"></script>
    <link rel="stylesheet" href="/css/style.css?v=3">
    <link rel="icon" href="/logo.svg" type="image/svg+xml">
</head>
<body>

    <!-- ========== LOGIN ========== -->
    <div class="login-page" id="login-view">
        <div class="login-card">
            <img class="logo" src="/logo.svg" alt="" width="64" height="64">
            <h1>Verwaltung</h1>
            <form id="login-form">
                <div class="field">
                    <label for="l-user">Benutzername</label>
                    <input id="l-user" type="text" name="username" autocapitalize="none" spellcheck="false" autocomplete="username" required>
                </div>
                <div class="field">
                    <label for="l-pw">Passwort</label>
                    <input id="l-pw" type="password" name="password" autocomplete="current-password" required>
                </div>
                <button type="submit" class="primary submit">Anmelden</button>
                <div class="error" id="login-error" role="alert"></div>
            </form>
        </div>
    </div>

    <!-- ========== DASHBOARD ========== -->
    <div id="dashboard-view" style="display:none;">
        <header class="site-header">
            <div class="inner">
                <div class="brand">
                    <img src="/logo.svg" alt="" width="32" height="32">
                    <span>Verwaltung<span class="accent">.</span></span>
                </div>
                <div class="nav-actions">
                <button class="modus-knopf" type="button" data-modus-schalter></button>
                    <span class="badge" id="me-badge">—</span>
                    <button id="logout-btn" type="button">Abmelden</button>
                </div>
            </div>
        </header>

        <div class="admin-layout">
            <div class="admin-tabs" role="tablist" aria-label="Bereiche">
                <button class="tab active" data-tab="analytics">Auswertung</button>
                <button class="tab" data-tab="services">Leistungen</button>
                <button class="tab" data-tab="orders">Bestellungen</button>
            </div>

            <!-- =========== ANALYTICS =========== -->
            <div class="tab-panel active" id="tab-analytics">
                <div class="stat-cards" id="stat-cards"></div>

                <div class="analytics-grid">
                    <div class="panel">
                        <h3>Umsatz (letzte 14 Tage)</h3>
                        <div id="chart-14d"></div>
                    </div>
                    <div class="panel">
                        <h3>Top-Leistungen</h3>
                        <div id="top-services"></div>
                    </div>
                </div>

                <div class="analytics-grid" style="margin-top:24px;">
                    <div class="panel">
                        <h3>Status-Verteilung</h3>
                        <div id="status-dist"></div>
                    </div>
                    <div class="panel">
                        <h3>Zahlungsmethoden</h3>
                        <div id="payment-dist"></div>
                    </div>
                </div>

                <div class="panel" style="margin-top:24px;">
                    <h3>Letzte Bestellungen</h3>
                    <div id="recent-orders"></div>
                </div>
            </div>

            <!-- =========== SERVICES =========== -->
            <div class="tab-panel" id="tab-services">
                <div class="admin-grid">
                    <div class="panel">
                        <h3 id="service-form-title">Neue Leistung</h3>
                        <form id="service-form">
                            <input type="hidden" name="id">
                            <div class="field">
                                <label for="s-name">Name</label>
                                <input id="s-name" type="text" name="name" required>
                            </div>
                            <div class="field">
                                <label for="s-desc">Beschreibung</label>
                                <textarea id="s-desc" name="description" rows="3"></textarea>
                            </div>
                            <div class="field-row">
                                <div class="field">
                                    <label for="s-preis">Preis (EUR)</label>
                                    <input id="s-preis" type="number" inputmode="decimal" name="price_eur" step="0.01" min="0" required>
                                </div>
                                <div class="field">
                                    <label for="s-kat">Kategorie</label>
                                    <input id="s-kat" type="text" name="category" placeholder="z. B. Beratung">
                                </div>
                            </div>
                            <div class="field">
                                <label for="s-dauer">Dauer / Aufwand</label>
                                <input id="s-dauer" type="text" name="duration" placeholder="z. B. 60 min, 1–2 Tage">
                            </div>
                            <div class="field">
                                <label for="s-bild">Bild-Adresse</label>
                                <input id="s-bild" type="url" name="image_url" placeholder="https://...">
                            </div>
                            <div class="field" style="display:flex;align-items:center;gap:10px;">
                                <input type="checkbox" name="active" id="service-active" checked style="width:auto;margin:0;">
                                <label for="service-active" style="margin:0;">Im Shop sichtbar</label>
                            </div>
                            <div style="display:flex;gap:8px;margin-top:16px;">
                                <button type="submit" class="primary" style="flex:1;" id="service-save-btn">Sichern</button>
                                <button type="button" id="service-cancel-btn" style="display:none;">Abbrechen</button>
                            </div>
                            <div class="error" id="service-error" role="alert" style="margin-top:8px;"></div>
                        </form>
                    </div>

                    <div>
                        <div class="section-header">
                            <h2>Leistungen</h2>
                            <span class="meta" id="services-meta"></span>
                        </div>
                        <div class="admin-product-list" id="admin-services"></div>
                    </div>
                </div>
            </div>

            <!-- =========== ORDERS =========== -->
            <div class="tab-panel" id="tab-orders">
                <div class="section-header">
                    <h2>Bestellungen</h2>
                    <span class="meta" id="orders-meta"></span>
                </div>
                <div class="orders-list" id="orders-list"></div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="/js/himmel.js?v=1" defer></script>
    <script src="/js/admin.js?v=3"></script>
</body>
</html>
